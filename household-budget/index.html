<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1411" />
<title>Household Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--ivory:#f3eadb;--paper:#fbf6ec;--ink:#121714;--mute:#6d675c;--line:rgba(18,23,20,.10);--gold:#b0893a;--pine:#14221c;--rose:#8a3a34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{height:100dvh;overflow:hidden;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#efe4d0,#f3eadb);padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
.app{height:100%;max-width:820px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--pine);color:#e8d7a8;display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:18px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
h1{font-family:"Cormorant Garamond",serif;font-size:22px;margin:0;font-weight:600;line-height:1}
.icon{width:36px;height:36px;border:1px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer}
.hero{background:var(--pine);color:#f4ece0;border-radius:20px;padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end}
.hero .label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.62;font-weight:600}
.hero .amount{font-family:"Cormorant Garamond",serif;font-size:clamp(36px,9vw,52px);line-height:.9;margin:4px 0 0;font-weight:600}
.chip{align-self:start;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border:1px solid rgba(232,215,168,.28);color:#e8d7a8;border-radius:999px;padding:5px 8px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.stat span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;font-weight:600}
.stat b{font-size:13px}
.board{min-height:0;display:grid;grid-template-columns:.9fr 1.2fr;gap:10px}
.col{min-height:0;background:var(--paper);border-radius:18px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 10px 30px rgba(18,23,20,.06)}
.col-h{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.col-h h2{margin:0;font-family:"Cormorant Garamond",serif;font-size:20px}
.ghost{border:0;background:none;color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;padding:8px}
.list{overflow:auto;padding:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-radius:12px}
.name{font-size:13px;font-weight:600}
.meta{font-size:10px;color:var(--mute)}
.amt{font-size:13px;font-weight:700}
.empty{color:var(--mute);font-size:12px;padding:16px 10px;text-align:center}
.foot{display:flex;justify-content:space-between;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
.tiny{border:0;background:transparent;color:var(--mute);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;padding:6px}
dialog{border:0;border-radius:20px;padding:0;width:min(92vw,400px);background:var(--paper)}
dialog::backdrop{background:rgba(10,14,12,.5)}
.sheet{padding:18px}
.sheet h2{font-family:"Cormorant Garamond",serif;margin:2px 0 8px;font-size:28px}
label{display:block;font-size:11px;font-weight:700;margin:10px 0 5px}
input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
.btn{width:100%;border:0;background:var(--pine);color:#fff;border-radius:12px;padding:12px;font-weight:700;margin-top:14px;cursor:pointer;font-family:inherit;font-size:16px}
.btn.ghost{background:#efe6d6;color:var(--ink);margin-top:7px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none!important}
.share-box{background:#efe6d6;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:12px;margin-top:8px;max-height:28vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#121714;color:#fff;padding:8px 12px;border-radius:999px;opacity:0;font-size:12px;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark" id="mark">H</div>
      <div>
        <div class="eyebrow" id="monthLabel">This month</div>
        <h1 id="homeTitle">Household</h1>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="icon" type="button" id="shareNav">Share</button>
      <button class="icon" type="button" id="settingsBtn">Set</button>
    </div>
  </header>
  <section class="hero" id="hero">
    <div>
      <div class="label" id="leftLabel">Left after bills</div>
      <div class="amount" id="leftAmount">0.00</div>
    </div>
    <div class="chip" id="statusChip">Ready</div>
    <div class="stats">
      <div class="stat"><span>Income</span><b id="incomeTotal">0</b></div>
      <div class="stat"><span>Bills</span><b id="billsTotal">0</b></div>
      <div class="stat"><span>Still due</span><b id="stillToPay">0</b></div>
      <div class="stat"><span>Per day</span><b id="dailyLeft">0</b></div>
    </div>
  </section>
  <section class="board">
    <div class="col">
      <div class="col-h"><h2>Pay</h2><button class="ghost" type="button" id="addIncomeBtn">+ Add</button></div>
      <div class="list" id="incomeList"></div>
      <div class="foot"><span id="incomeCount">0 sources</span><span>monthly</span></div>
    </div>
    <div class="col">
      <div class="col-h"><h2>Bills</h2><button class="ghost" type="button" id="addBillBtn">+ Add</button></div>
      <div class="list" id="billsList"></div>
      <div class="foot"><span id="billsCount">0 items</span><span id="paidNote">none paid</span></div>
    </div>
  </section>
</div>
<dialog id="itemDialog">
  <form class="sheet" method="dialog">
    <div class="eyebrow" id="dialogEyebrow">Outgoing</div>
    <h2 id="dialogTitle">New bill</h2>
    <input type="hidden" id="editId" />
    <input type="hidden" id="editKind" />
    <label>Name</label>
    <input id="itemName" placeholder="Rent, Tesco, Salary" />
    <label>Amount</label>
    <input id="itemAmount" inputmode="decimal" placeholder="0.00" />
    <div id="billExtras">
      <div class="split">
        <div>
          <label>Category</label>
          <select id="itemCat">
            <option>Home</option><option>Utilities</option><option>Food</option>
            <option>Transport</option><option>Insurance</option>
            <option>Phone and internet</option><option>Subscriptions</option>
            <option>Kids</option><option>Other</option>
          </select>
        </div>
        <div>
          <label>Due day</label>
          <input id="itemDue" inputmode="numeric" placeholder="28" />
        </div>
      </div>
    </div>
    <button class="btn" type="button" id="saveBtn">Save</button>
    <button class="btn ghost" type="button" id="cancelBtn">Cancel</button>
  </form>
</dialog>
<dialog id="settingsDialog">
  <form class="sheet" method="dialog">
    <div class="eyebrow">Preferences</div>
    <h2>Household</h2>
    <label>Name</label>
    <input id="houseName" maxlength="32" />
    <label>Currency</label>
    <select id="currency">
      <option value="£">£ British pound</option>
      <option value="$">$ US dollar</option>
      <option value="€">€ Euro</option>
      <option value="R">R South African rand</option>
      <option value="N">N Naira</option>
    </select>
    <button class="btn" type="button" id="saveSettings">Save</button>
    <button class="btn ghost" type="button" id="closeSettings">Close</button>
  </form>
</dialog>
<dialog id="shareDialog">
  <div class="sheet">
    <div class="eyebrow">Together</div>
    <h2>Share</h2>
    <div class="share-box" id="summaryBox"></div>
    <button class="btn" type="button" id="shareTextBtn">Send summary</button>
    <button class="btn ghost" type="button" id="copySummaryBtn">Copy</button>
    <button class="btn ghost" type="button" id="closeShare">Close</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script>
(function(){
  var KEY = "household-budget-v1";
  function el(id){ return document.getElementById(id); }
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)); }
    catch(e){ return null; }
  }
  var state = load() || { name:"Household", currency:"\u00a3", incomes:[], bills:[] };
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  el("monthLabel").textContent = months[new Date().getMonth()] + " " + new Date().getFullYear();
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); render(); }
  function money(n){
    var num = Number(n) || 0;
    var abs = Math.abs(num).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
    return (num < 0 ? "-" : "") + state.currency + abs;
  }
  function uid(){ return String(Date.now()) + String(Math.floor(Math.random()*1000)); }
  function toast(msg){
    var t = el("toast");
    t.textContent = msg;
    t.className = "toast show";
    setTimeout(function(){ t.className = "toast"; }, 1600);
  }
  function clean(s){
    return String(s).replace(/&/g,"and").replace(/</g,"").replace(/>/g,"");
  }
  function totals(){
    var income=0, bills=0, paid=0, i;
    for(i=0;i<state.incomes.length;i++) income += Number(state.incomes[i].amount||0);
    for(i=0;i<state.bills.length;i++){
      bills += Number(state.bills[i].amount||0);
      if(state.bills[i].paid) paid += Number(state.bills[i].amount||0);
    }
    var last = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    var daysLeft = Math.max(1, last - new Date().getDate() + 1);
    var left = income - bills;
    return {income:income,bills:bills,paid:paid,unpaid:bills-paid,left:left,daily:left/daysLeft};
  }
  function render(){
    var name = state.name || "Household";
    el("homeTitle").textContent = name;
    el("mark").textContent = name.charAt(0).toUpperCase();
    var t = totals();
    el("leftLabel").textContent = t.left < 0 ? "Short this month" : "Left after bills";
    el("leftAmount").textContent = money(t.left);
    el("incomeTotal").textContent = money(t.income);
    el("billsTotal").textContent = money(t.bills);
    el("stillToPay").textContent = money(t.unpaid);
    el("dailyLeft").textContent = money(Math.max(0,t.daily));
    el("incomeCount").textContent = state.incomes.length + " sources";
    el("billsCount").textContent = state.bills.length + " items";
    el("paidNote").textContent = t.paid ? money(t.paid) + " paid" : "none paid";
    el("statusChip").textContent = (!t.income && !t.bills) ? "Ready" : (t.left < 0 ? "Over" : "Clear");
    var html = "";
    if(!state.incomes.length) html = '<div class="empty">Add each wage.</div>';
    else {
      for(var i=0;i<state.incomes.length;i++){
        var inc = state.incomes[i];
        html += '<div class="row"><div><div class="name">'+clean(inc.name)+'</div><div class="meta">each month</div></div><div><span class="amt">'+money(inc.amount)+'</span> <button class="tiny" type="button" data-act="edit-in" data-id="'+inc.id+'">Edit</button></div></div>';
      }
    }
    el("incomeList").innerHTML = html;
    html = "";
    if(!state.bills.length) html = '<div class="empty">Add rent, utilities, food.</div>';
    else {
      for(var j=0;j<state.bills.length;j++){
        var b = state.bills[j];
        html += '<div class="row"><div><div class="name">'+clean(b.name)+'</div><div class="meta">'+clean(b.category||"Other")+'</div></div><div><span class="amt">'+money(b.amount)+'</span> <button class="tiny" type="button" data-act="edit-bill" data-id="'+b.id+'">Edit</button></div></div>';
      }
    }
    el("billsList").innerHTML = html;
    var lines = [name + " " + months[new Date().getMonth()], "Income "+money(t.income), "Bills "+money(t.bills), "Left "+money(t.left)];
    el("summaryBox").textContent = lines.join("\n");
  }
  function openItem(kind, item){
    el("editKind").value = kind;
    el("editId").value = item ? item.id : "";
    el("dialogEyebrow").textContent = kind === "bill" ? "Outgoing" : "Incoming";
    el("dialogTitle").textContent = item ? "Edit" : (kind === "bill" ? "New bill" : "New income");
    el("itemName").value = item ? item.name : "";
    el("itemAmount").value = item ? item.amount : "";
    el("itemCat").value = item && item.category ? item.category : "Home";
    el("itemDue").value = item && item.due ? item.due : "";
    el("billExtras").className = kind === "bill" ? "" : "hidden";
    el("itemDialog").showModal();
  }
  el("addIncomeBtn").addEventListener("click", function(){ openItem("income"); });
  el("addBillBtn").addEventListener("click", function(){ openItem("bill"); });
  el("cancelBtn").addEventListener("click", function(){ el("itemDialog").close(); });
  el("saveBtn").addEventListener("click", function(){
    var name = el("itemName").value.trim();
    var amount = Number(String(el("itemAmount").value).replace(/,/g,""));
    if(!name || !amount){ toast("Add a name and amount"); return; }
    var kind = el("editKind").value;
    var id = el("editId").value;
    if(kind === "bill"){
      var data = {id: id || uid(), name:name, amount:amount, category:el("itemCat").value, due:el("itemDue").value.trim(), paid:false};
      var found = false;
      for(var i=0;i<state.bills.length;i++){ if(state.bills[i].id===id){ data.paid=state.bills[i].paid; state.bills[i]=data; found=true; } }
      if(!found) state.bills.push(data);
    } else {
      var data2 = {id: id || uid(), name:name, amount:amount};
      var found2 = false;
      for(var k=0;k<state.incomes.length;k++){ if(state.incomes[k].id===id){ state.incomes[k]=data2; found2=true; } }
      if(!found2) state.incomes.push(data2);
    }
    el("itemDialog").close();
    save();
  });
  el("settingsBtn").addEventListener("click", function(){
    el("houseName").value = state.name || "";
    el("currency").value = state.currency || "\u00a3";
    el("settingsDialog").showModal();
  });
  el("saveSettings").addEventListener("click", function(){
    state.name = el("houseName").value.trim() || "Household";
    state.currency = el("currency").value;
    el("settingsDialog").close();
    save();
  });
  el("closeSettings").addEventListener("click", function(){ el("settingsDialog").close(); });
  el("shareNav").addEventListener("click", function(){ el("shareDialog").showModal(); });
  el("closeShare").addEventListener("click", function(){ el("shareDialog").close(); });
  el("copySummaryBtn").addEventListener("click", function(){
    if(navigator.clipboard) navigator.clipboard.writeText(el("summaryBox").textContent);
    toast("Copied");
  });
  el("shareTextBtn").addEventListener("click", function(){
    var text = el("summaryBox").textContent;
    if(navigator.share){ navigator.share({title:"Budget", text:text}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(text); toast("Copied"); }
  });
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn) return;
    var act = btn.getAttribute("data-act");
    var id = btn.getAttribute("data-id");
    if(act === "edit-in"){
      for(var i=0;i<state.incomes.length;i++) if(state.incomes[i].id===id) openItem("income", state.incomes[i]);
    }
    if(act === "edit-bill"){
      for(var j=0;j<state.bills.length;j++) if(state.bills[j].id===id) openItem("bill", state.bills[j]);
    }
  });
  render();
})();
</script>
</body>
</html>
