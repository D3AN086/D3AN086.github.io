<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1411" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Household Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark" id="mark">H</div>
        <div>
          <div class="eyebrow" id="monthLabel">This month</div>
          <h1 id="homeTitle">Household</h1>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="icon" id="shareNav" aria-label="Share">↗</button>
        <button class="icon" id="settingsBtn" aria-label="Settings">⚙</button>
      </div>
    </header>
    <section class="hero" id="hero">
      <div>
        <div class="label" id="leftLabel">Left after bills</div>
        <div class="amount" id="leftAmount">£0.00</div>
      </div>
      <div class="chip" id="statusChip">Ready</div>
      <div class="stats">
        <div class="stat"><span>Income</span><b id="incomeTotal">£0</b></div>
        <div class="stat"><span>Bills</span><b id="billsTotal">£0</b></div>
        <div class="stat"><span>Still due</span><b id="stillToPay">£0</b></div>
        <div class="stat"><span>Per day</span><b id="dailyLeft">£0</b></div>
      </div>
    </section>
    <section class="board">
      <div class="col">
        <div class="col-h"><h2>Pay</h2><button class="ghost" id="addIncomeBtn">+ Add</button></div>
        <div class="list" id="incomeList"></div>
        <div class="foot"><span id="incomeCount">0 sources</span><span>monthly</span></div>
      </div>
      <div class="col">
        <div class="col-h"><h2>Bills</h2><button class="ghost" id="addBillBtn">+ Add</button></div>
        <div class="list" id="billsList"></div>
        <div class="foot"><span id="billsCount">0 items</span><span id="paidNote">none paid</span></div>
      </div>
    </section>
  </div>
  <dialog id="itemDialog">
    <form class="sheet" method="dialog">
      <div class="eyebrow" id="dialogEyebrow">Outgoing</div>
      <h2 id="dialogTitle">New bill</h2>
      <input type="hidden" id="editId" /><input type="hidden" id="editKind" />
      <label>Name</label><input id="itemName" required placeholder="Rent, Tesco, Salary" />
      <label>Amount</label><input id="itemAmount" required inputmode="decimal" placeholder="0.00" />
      <div id="billExtras"><div class="split">
        <div><label>Category</label><select id="itemCat"><option>Home</option><option>Utilities</option><option>Food</option><option>Transport</option><option>Insurance</option><option>Phone & internet</option><option>Subscriptions</option><option>Kids</option><option>Other</option></select></div>
        <div><label>Due day</label><input id="itemDue" inputmode="numeric" placeholder="28" /></div>
      </div></div>
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn ghost" value="cancel">Cancel</button>
    </form>
  </dialog>
  <dialog id="settingsDialog">
    <form class="sheet" method="dialog">
      <div class="eyebrow">Preferences</div><h2>Household</h2>
      <label>Name</label><input id="houseName" maxlength="32" />
      <label>Currency</label>
      <select id="currency"><option value="£">£ British pound</option><option value="$">$ US dollar</option><option value="€">€ Euro</option><option value="R">R South African rand</option><option value="₦">₦ Naira</option></select>
      <p class="hint">Saved on this phone. Share a backup for the same list on hers.</p>
      <button class="btn" id="saveSettings">Save</button>
      <button class="btn ghost" value="cancel">Close</button>
    </form>
  </dialog>
  <dialog id="shareDialog">
    <div class="sheet">
      <div class="eyebrow">Together</div><h2>Share</h2>
      <div class="share-box" id="summaryBox"></div>
      <button class="btn" id="shareTextBtn">Send summary</button>
      <button class="btn ghost" id="copySummaryBtn">Copy</button>
      <button class="btn ghost" id="exportBtn">Download backup</button>
      <button class="btn ghost" id="importBtn">Load backup</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden" />
      <button class="btn ghost" id="closeShare">Close</button>
    </div>
  </dialog>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
