<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-title" content="Downtown Empire">
<title>Downtown Empire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500;700&display=swap">
<link rel="stylesheet" href="banner.css">
<style>
html,body{margin:0;height:100%;height:100dvh;background:#0a0a0c;overflow:hidden;font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;min-height:0;background:#0a0a0c}
</style>
</head>
<body>
<div class="empire-banner">
  <div class="art"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="kicker">The Family</div>
    <div class="title">Downtown Empire</div>
    <div class="city">New York · Open world crime</div>
  </div>
</div>
<iframe id="gameframe" src="Index.html" title="Downtown Empire"></iframe>
<script>
(function(){
  var frame=document.getElementById('gameframe');
  function dress(){
    try{
      var doc=frame.contentDocument;
      if(!doc) return;
      var style=doc.getElementById('de-street-dress');
      if(!style){
        style=doc.createElement('style');
        style.id='de-street-dress';
        style.textContent=[
          '#next-card,#heat-card,#rival-card,#event-card,.rival-card{display:none!important}',
          '.pb-streets .pb-sub{color:#e8d18a;font-size:11px;letter-spacing:.03em;line-height:1.35;max-width:94%}',
          '.pb-streets{height:100px}',
          '#p-dashboard .cd h3{letter-spacing:.12em}'
        ].join('');
        doc.head.appendChild(style);
      }
      var cards=doc.querySelectorAll('#p-dashboard .cd');
      cards.forEach(function(card){
        var h=card.querySelector('h3');
        if(!h) return;
        var label=(h.textContent||'').replace(/\s+/g,' ').trim();
        if(/^Welcome/.test(label) || label==='Next unlock' || label==='Heat' || label==='Rival window' || label==='Street event'){
          card.remove();
        }
      });
      var next=doc.getElementById('next-line');
      var heat=doc.getElementById('heat-line');
      var city=doc.getElementById('dci');
      var house=doc.getElementById('dh');
      var sub=doc.querySelector('.pb-streets .pb-sub');
      var title=doc.querySelector('.pb-streets .pb-title');
      if(title) title.textContent='The Streets';
      function line(){
        var heatTxt=(heat && heat.textContent || '').trim();
        var nextTxt=(next && next.textContent || '').trim();
        var cityTxt=(city && city.textContent || '').trim();
        var houseTxt=(house && house.textContent || '').trim();
        if(heatTxt==='Quiet' || heatTxt==='Quiet streets') heatTxt='The block is quiet';
        if(nextTxt==='Play to reveal') nextTxt='';
        var bits=[];
        if(cityTxt) bits.push(cityTxt+(houseTxt ? ' · '+houseTxt : ''));
        if(heatTxt) bits.push(heatTxt);
        if(nextTxt) bits.push(nextTxt);
        if(sub) sub.textContent=bits.join(' · ') || 'The corner is yours';
      }
      line();
      if(next && !next.dataset.watch){
        next.dataset.watch='1';
        new MutationObserver(line).observe(next,{childList:true,characterData:true,subtree:true});
      }
      if(heat && !heat.dataset.watch){
        heat.dataset.watch='1';
        new MutationObserver(line).observe(heat,{childList:true,characterData:true,subtree:true});
      }
    }catch(e){}
  }
  frame.addEventListener('load', function(){
    dress();
    setTimeout(dress, 400);
    setTimeout(dress, 1200);
  });
})();
</script>
</body>
</html>
