<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-title" content="Downtown Empire">
<title>Downtown Empire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500;700&display=swap">
<link rel="stylesheet" href="banner.css">
<style>
html,body{margin:0;height:100%;height:100dvh;background:#0a0a0c;overflow:hidden;font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;min-height:0;background:#0a0a0c}
</style>
</head>
<body>
<div class="empire-banner">
  <div class="art"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="kicker">The Family</div>
    <div class="title">Downtown Empire</div>
    <div class="city">New York · Open world crime</div>
  </div>
</div>
<iframe id="gameframe" src="Index.html" title="Downtown Empire"></iframe>
<script>
(function(){
  var frame=document.getElementById('gameframe');
  function strip(){
    try{
      var doc=frame.contentDocument;
      if(!doc) return;
      ['rival-card','event-card'].forEach(function(id){
        var el=doc.getElementById(id);
        if(el) el.remove();
      });
      var style=doc.createElement('style');
      style.textContent='#rival-card,.rival-card,#event-card{display:none!important}';
      doc.head.appendChild(style);
    }catch(e){}
  }
  frame.addEventListener('load', strip);
})();
</script>
</body>
</html>
