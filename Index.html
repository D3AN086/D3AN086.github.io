<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Downtown Empire</title>
<style>html,body{margin:0;background:#0a0a0c;color:#c9c0b0;font-family:Inter,system-ui,sans-serif}</style>
</head>
<body>
<script>
(function(){
  var src='https://raw.githubusercontent.com/D3AN086/D3AN086.github.io/8a64f76da478e850d25821720ad19ca5e0dd3045/Index.html';
  fetch(src).then(function(r){return r.text()}).then(function(html){
    html=html.replace('</style>','#next-card,#heat-card,#rival-card,#event-card,.rival-card,.next-card{display:none!important}</style>');
    html=html.replace(/<div class="cd"><h3>Welcome,[\s\S]*?<\/div>/,'');
    html=html.replace('Your empire starts here','The corner is yours');
    document.open();
    document.write(html);
    document.close();
  }).catch(function(){
    document.body.textContent='Could not load the streets.';
  });
})();
</script>
</body>
</html>
